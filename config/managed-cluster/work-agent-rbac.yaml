# Grants the Open Cluster Management work agent permission to manage
# XAccessPolicy objects, the only resource FleetPermit delivers. OCM aggregates
# ClusterRoles with this label into the work agent's role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetpermit:work-agent
  labels:
    open-cluster-management.io/aggregate-to-work: "true"
    app.kubernetes.io/part-of: fleetpermit
rules:
  - apiGroups: ["agentic.networking.x-k8s.io"]
    resources: ["xaccesspolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
