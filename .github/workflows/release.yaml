# Publishes signed images to ghcr.io and signed release assets (Helm chart,
# SPDX SBOM) when a v* tag is pushed. Signing is keyless with Sigstore cosign
# using the workflow's OIDC identity; see docs/operations.md#verifying-releases.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach assets to the GitHub release
      packages: write   # push images to ghcr.io
      id-token: write   # keyless signing
    steps:
      - name: Wait for the GitHub release
        # The maintainer creates the release (with its notes) right after pushing the tag; this job
        # only attaches artifacts. Stop before pushing images if the release never appears.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 30); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "no GitHub release named ${GITHUB_REF_NAME}; create it, then re-run this job" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Helm
        run: ./hack/install-helm.sh
      - name: Test
        run: make test-unit test-integration
      - name: Build and push multi-arch images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./hack/publish-images.sh "${REGISTRY}" "${TAG}"
      - name: SBOM and chart
        run: |
          make sbom
          helm package charts/fleetpermit --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME}" -d dist
      - name: Sign images and release assets
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./hack/sign-release.sh dist/images.txt dist/*.tgz dist/*.spdx.json
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tgz dist/*.spdx.json dist/*.sigstore.json dist/images.txt --clobber
