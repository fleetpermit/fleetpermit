# Signs the images and assets of an already published release (for releases
# made before signing was added). Run manually with the release tag.
name: Sign existing release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sign, for example v0.1.0
        required: true
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve image digests and download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          echo "${REGISTRY_TOKEN}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in fleetpermit-controller demo-mcp-tools demo-probe; do
            ref="ghcr.io/${{ github.repository_owner }}/${img}:${TAG}"
            echo "${ref%:*}@$(cosign triangulate --type digest "${ref}" | sed 's/.*@//')" >> dist/images.txt
          done
          gh release download "${TAG}" -p '*.tgz' -p '*.spdx.json' -D dist
      - name: Sign and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          ./hack/sign-release.sh dist/images.txt dist/*.tgz dist/*.spdx.json
          gh release upload "${TAG}" dist/*.sigstore.json dist/images.txt --clobber
