# Weekly early warning: compares pinned upstream versions with the latest
# releases and runs the integration suite against the latest upstream
# XAccessPolicy CRD. See docs/upstream-compatibility.md.
name: Upstream canary
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: make upstream-canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make upstream-canary
