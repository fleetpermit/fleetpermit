<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="dm-t dm-d">
<title id="dm-t">FleetPermit decision rule: 2 agents, 3 clusters, 4 tools</title>
<desc id="dm-d">Expected decisions from policy sre-remediation and one active lease, drawn as two grids. With the lease active, only sre-agent calling get_cluster_health or restart_workload on cluster-east or cluster-west is allowed; every other combination is denied, including scale_workload (permitted by the policy but not granted by the lease), read_secret (not permitted), cluster-edge (outside the placement) and security-agent (not a subject). With the lease expired, every combination is denied. This is a diagram of the policy, not a test result.</desc>
