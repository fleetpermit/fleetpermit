<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="sec-t sec-d">
  <title id="sec-t">FleetPermit security model</title>
  <desc id="sec-d">Two trust zones separated by the Open Cluster Management delivery channel. In the hub cluster, admission validation rejects malformed policies and failMode accepts only Closed (F1); the fleetpermit-controller has no access to the Secret, workload or RBAC APIs but can read and write ManifestWork for every managed cluster, withdraws grants on render errors or a missing Placement (F2), and treats Denied and Expired leases as terminal while only the controller writes lease status (F3). ManifestWork carries rendered XAccessPolicy objects to the managed cluster, where work-agent-rbac.yaml adds XAccessPolicy permissions to the OCM work agent. On the managed cluster, Kubernetes Pod Certificates issue the agent's SPIFFE X.509 identity; the Envoy gateway verifies that identity over mTLS and evaluates tool name and request time, so expiry holds even with the hub unreachable (F4); a default-deny anchor, when installed, closes a backend without a grant (F5); a wrong identity, an unlisted tool or an unselected cluster is denied (F6).</desc>
  <defs>
    <style>
      svg { fill: #E6EDF6; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 17px; font-weight: 700; }
      .h3 { font-size: 15px; font-weight: 650; }
      .sm { font-size: 13.5px; fill: #A9B8CD; }
      .xs { font-size: 12.5px; fill: #A9B8CD; }
      .allow { fill: #2DD4BF; }
      .deny { fill: #FF7A7A; }
      .zone { fill: #0F1E33; stroke: #3A5378; stroke-width: 1.5; }
      .box { fill: #13233A; stroke: #2E4468; stroke-width: 1.5; }
      .fc circle { fill: #4A1D27; stroke: #FF7A7A; stroke-width: 1.6; }
      .fc text { font-size: 11.5px; font-weight: 700; fill: #FFB3B3; text-anchor: middle; }
      .wire { fill: none; stroke: #2DD4BF; stroke-width: 2.2; }
    </style>
    <marker id="sec-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="20" fill="#0C1728"/>
  <text class="h1" x="40" y="52">Trust boundaries and failure handling</text>
  <text class="sm" x="40" y="78">With the default-deny anchor installed, errors never add authority: a failure withdraws grants or leaves them to expire on time.</text>

  <!-- Hub zone -->
  <rect class="zone" x="40" y="104" width="400" height="520" rx="16"/>
  <text class="h2" x="62" y="136">Hub cluster</text>

  <rect class="box" x="60" y="154" width="360" height="78" rx="10"/>
  <text class="h3" x="78" y="182">API server admission</text>
  <text class="sm" x="78" y="206">CRD schema and CEL validation;</text>
  <text class="sm" x="78" y="224">failMode accepts only Closed</text>
  <g class="fc" transform="translate(396 176)"><circle r="14"/><text y="4">F1</text></g>

  <rect class="box" x="60" y="250" width="360" height="118" rx="10" stroke="#2DD4BF"/>
  <text class="h3 mono allow" x="78" y="278">fleetpermit-controller</text>
  <text class="sm" x="78" y="304">No access to Secret, workload or RBAC APIs.</text>
  <text class="sm" x="78" y="323">Reads and writes ManifestWork for every</text>
  <text class="sm" x="78" y="342">managed cluster: protect its credential</text>
  <g class="fc" transform="translate(362 272)"><circle r="14"/><text y="4">F2</text></g>
  <g class="fc" transform="translate(396 272)"><circle r="14"/><text y="4">F3</text></g>

  <rect class="box" x="60" y="386" width="360" height="62" rx="10"/>
  <text class="h3" x="78" y="412">Open Cluster Management hub</text>
  <text class="xs mono" x="78" y="434">Placement, PlacementDecision, ManifestWork</text>

  <g transform="translate(60 474)">
    <g class="fc" transform="translate(14 14)"><circle r="12"/><text y="4">F1</text></g>
    <text class="xs" x="36" y="19">Malformed policies are rejected at admission</text>
    <g class="fc" transform="translate(14 50)"><circle r="12"/><text y="4">F2</text></g>
    <text class="xs" x="36" y="47">A render error or missing Placement</text>
    <text class="xs" x="36" y="63">withdraws grants</text>
    <g class="fc" transform="translate(14 96)"><circle r="12"/><text y="4">F3</text></g>
    <text class="xs" x="36" y="101">Denied and Expired leases are terminal while</text>
    <text class="xs" x="36" y="117">only the controller writes lease status</text>
  </g>

  <!-- Boundary -->
  <line x1="480" y1="104" x2="480" y2="624" stroke="#F5B544" stroke-width="1.6" stroke-dasharray="8 7"/>

  <!-- Managed zone -->
  <rect class="zone" x="520" y="104" width="640" height="520" rx="16"/>
  <text class="h2" x="542" y="136">Managed cluster</text>

  <rect class="box" x="540" y="154" width="290" height="78" rx="10"/>
  <text class="h3" x="558" y="182">OCM work agent</text>
  <text class="sm" x="558" y="206">XAccessPolicy access added by</text>
  <text class="xs mono" x="558" y="224">work-agent-rbac.yaml</text>

  <rect class="box" x="850" y="154" width="290" height="78" rx="10"/>
  <text class="h3" x="868" y="182">Kubernetes Pod Certificates</text>
  <text class="sm" x="868" y="206">Issue each agent a SPIFFE</text>
  <text class="sm" x="868" y="224">X.509 identity</text>

  <rect class="box" x="540" y="250" width="290" height="118" rx="10" stroke="#2DD4BF"/>
  <text class="h3" x="558" y="278">Envoy gateway</text>
  <text class="sm" x="558" y="304">mTLS: verifies the SPIFFE ID</text>
  <text class="sm" x="558" y="323">CEL: tool name and request.time</text>
  <text class="xs" x="558" y="348">programmed from XAccessPolicy</text>
  <g class="fc" transform="translate(772 272)"><circle r="14"/><text y="4">F4</text></g>
  <g class="fc" transform="translate(806 272)"><circle r="14"/><text y="4">F6</text></g>

  <rect class="box" x="850" y="250" width="290" height="118" rx="10"/>
  <text class="h3" x="868" y="278">Agent workload</text>
  <text class="xs mono" x="868" y="304">spiffe://cluster.local/</text>
  <text class="xs mono" x="868" y="322">ns/agents/sa/sre-agent</text>
  <text class="xs" x="868" y="348">presents its certificate over mTLS</text>

  <rect class="box" x="540" y="386" width="290" height="62" rx="10" stroke="#FF7A7A"/>
  <text class="h3" x="558" y="412">Default-deny anchor</text>
  <text class="xs mono" x="558" y="434">fleetpermit-default-deny</text>
  <g class="fc" transform="translate(806 408)"><circle r="14"/><text y="4">F5</text></g>

  <rect class="box" x="850" y="386" width="290" height="62" rx="10"/>
  <text class="h3" x="868" y="412">MCP tool server</text>
  <text class="xs mono" x="868" y="434">XBackend behind the gateway</text>

  <path class="wire" d="M850 330H834" marker-end="url(#sec-a)"/>
  <path class="wire" d="M830 360H842V400H848" marker-end="url(#sec-a)"/>

  <g transform="translate(540 474)">
    <g class="fc" transform="translate(14 14)"><circle r="12"/><text y="4">F4</text></g>
    <text class="xs" x="36" y="19">Hub unreachable: expiry is still enforced by the gateway</text>
    <g class="fc" transform="translate(14 50)"><circle r="12"/><text y="4">F5</text></g>
    <text class="xs" x="36" y="55">No grant on a backend: the anchor, if installed, denies</text>
    <g class="fc" transform="translate(14 86)"><circle r="12"/><text y="4">F6</text></g>
    <text class="xs" x="36" y="91">Wrong identity, unlisted tool or unselected cluster: DENY</text>
  </g>

  <path class="wire" d="M420 309H458V190H536" marker-end="url(#sec-a)"/>
  <text class="xs" x="475" y="250" text-anchor="middle" transform="rotate(-90 475 250)">ManifestWork</text>
  <text class="xs" x="40" y="648">Dashed amber line: the trust boundary between the hub and each managed cluster. FleetPermit sends only rendered XAccessPolicy objects across it.</text>
</svg>
