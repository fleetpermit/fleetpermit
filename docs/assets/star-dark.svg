<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" role="img" aria-labelledby="t-dark">
<title id="t-dark">Star FleetPermit on GitHub</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.a{animation-duration:5s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.fb{transform-box:fill-box;transform-origin:center}
.pill{animation-name:press;animation-timing-function:ease-in-out}
.fill{animation-name:fill}
.plus{animation-name:plus}
.ring{opacity:0;animation-name:ring}
.cur{opacity:0;animation-name:cur;animation-timing-function:ease-in-out}
circle.a{opacity:0}
@keyframes press{0%,33%{transform:scale(1)}35.5%{transform:scale(.95)}40%,100%{transform:scale(1)}}
@keyframes fill{0%,36%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.3)}46%{transform:scale(.94)}50%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(.8)}}
@keyframes plus{0%,42%{opacity:0;transform:translateY(4px) scale(.3)}48%{opacity:1;transform:translateY(-3px) scale(1.25)}53%{transform:scale(.92)}58%{transform:scale(1.06)}62%,90%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(.6)}}
@keyframes ring{0%,37%{opacity:0;transform:scale(.8)}39%{opacity:.9;transform:scale(.9)}56%,100%{opacity:0;transform:scale(2.3)}}
@keyframes cur{0%{opacity:0;transform:translate(66px,20px)}8%{opacity:1}30%{transform:translate(0,0) scale(1)}34%{transform:translate(0,0) scale(.82)}38%{transform:translate(0,0) scale(1);opacity:1}62%{opacity:1;transform:translate(0,0)}72%,100%{opacity:0;transform:translate(18px,12px)}}
.s0{animation-name:s0}@keyframes s0{0%,37%{opacity:0;transform:none}39%{opacity:1;transform:none}55%,100%{opacity:0;transform:translate(0px,-13px) scale(.6)}}.s1{animation-name:s1}@keyframes s1{0%,37%{opacity:0;transform:none}39%{opacity:1;transform:none}55%,100%{opacity:0;transform:translate(11px,-7px) scale(.6)}}.s2{animation-name:s2}@keyframes s2{0%,37%{opacity:0;transform:none}39%{opacity:1;transform:none}55%,100%{opacity:0;transform:translate(11px,7px) scale(.6)}}.s3{animation-name:s3}@keyframes s3{0%,37%{opacity:0;transform:none}39%{opacity:1;transform:none}55%,100%{opacity:0;transform:translate(-11px,7px) scale(.6)}}.s4{animation-name:s4}@keyframes s4{0%,37%{opacity:0;transform:none}39%{opacity:1;transform:none}55%,100%{opacity:0;transform:translate(-11px,-7px) scale(.6)}}
@media (prefers-reduced-motion:reduce){.a{animation:none!important}}
</style>
<g class="a pill fb"><rect x="0.5" y="1.5" width="122" height="33" rx="9" fill="#0C1728" stroke="#2E4468"/>
<g transform="translate(16 18)"><path d="M0 -8.4L2.5 -3.2L8.1 -2.4L4 1.6L5 7.2L0 4.5L-5 7.2L-4 1.6L-8.1 -2.4L-2.5 -3.2Z" fill="none" stroke="#A9B8CD" stroke-width="1.5" stroke-linejoin="round"/>
<circle class="a ring fb" r="9" fill="none" stroke="#F5B544" stroke-width="1.6"/>
<g class="a fill fb"><path d="M0 -8.4L2.5 -3.2L8.1 -2.4L4 1.6L5 7.2L0 4.5L-5 7.2L-4 1.6L-8.1 -2.4L-2.5 -3.2Z" fill="#F5B544" stroke="#F5B544" stroke-width="1" stroke-linejoin="round"/></g>
<circle class="a s0" r="1.6" fill="#FDE68A"/><circle class="a s1" r="1.6" fill="#FDE68A"/><circle class="a s2" r="1.6" fill="#FDE68A"/><circle class="a s3" r="1.6" fill="#FDE68A"/><circle class="a s4" r="1.6" fill="#FDE68A"/></g>
<text x="31" y="22.4" font-size="12.5" font-weight="650" fill="#E6EDF6">Star on GitHub</text></g>
<g class="a plus fb"><rect x="128" y="7" width="31" height="22" rx="11" fill="#3F2E0B"/><text x="143.5" y="22" font-size="12" font-weight="800" text-anchor="middle" fill="#F5B544">+1</text></g>
<g transform="translate(15.5 17.5)"><g class="a cur"><path d="M0 0V13.5L3.3 10.4L5.8 16.2L8.2 15.2L5.7 9.5H10.3Z" fill="#FFFFFF" stroke="#0C1728" stroke-width="1.2" stroke-linejoin="round"/></g></g>
</svg>
