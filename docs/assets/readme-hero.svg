<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">FleetPermit: least privilege for agents, across every cluster</title>
  <desc id="hero-d">FleetPermit delivers a time-bound permit to cluster-east and cluster-west, where the gateway allows the leased tool call. cluster-edge is not selected and denies. When the lease timer runs out the permit fades and the same call is denied at the gateway. A new lease delivers the permit again.</desc>
  <style>
    svg { fill: #E6EDF6; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #A9B8CD; }
    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .tokE { animation-name: tokE; }
    .tokW { animation-name: tokW; }
    .allowP { animation-name: allowP; }
    .denyP { animation-name: denyP; }
    .ring { animation-name: ring; animation-timing-function: linear; }
    .capA { animation-name: capA; }
    .capB { animation-name: capB; }
    .capC { animation-name: capC; }
    .tLive { animation-name: tLive; }
    .tDead { animation-name: tDead; }
    @keyframes tokE {
      0%, 38% { transform: translate(0, 0); opacity: 1; }
      43% { transform: translate(0, 0); opacity: 0; }
      62% { transform: translate(-232px, 112px); opacity: 0; }
      66% { transform: translate(-232px, 112px); opacity: 1; }
      84%, 100% { transform: translate(0, 0); opacity: 1; }
    }
    @keyframes tokW {
      0%, 38% { transform: translate(0, 0); opacity: 1; }
      43% { transform: translate(0, 0); opacity: 0; }
      62% { transform: translate(-232px, 0); opacity: 0; }
      66% { transform: translate(-232px, 0); opacity: 1; }
      84%, 100% { transform: translate(0, 0); opacity: 1; }
    }
    @keyframes allowP { 0%, 38% { opacity: 1; } 42%, 86% { opacity: 0; } 90%, 100% { opacity: 1; } }
    @keyframes denyP { 0%, 39% { opacity: 0; } 43%, 60% { opacity: 1; } 64%, 100% { opacity: 0; } }
    @keyframes ring {
      0% { stroke-dashoffset: 0; opacity: 1; }
      38% { stroke-dashoffset: 163.4; opacity: 1; }
      60% { stroke-dashoffset: 163.4; opacity: 1; }
      62% { stroke-dashoffset: 163.4; opacity: 0; }
      63% { stroke-dashoffset: 0; opacity: 0; }
      67%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes capA { 0%, 38% { opacity: 1; } 41%, 88% { opacity: 0; } 92%, 100% { opacity: 1; } }
    @keyframes capB { 0%, 39% { opacity: 0; } 43%, 59% { opacity: 1; } 62%, 100% { opacity: 0; } }
    @keyframes capC { 0%, 61% { opacity: 0; } 64%, 86% { opacity: 1; } 89%, 100% { opacity: 0; } }
    @keyframes tLive { 0%, 38% { opacity: 1; } 40%, 61% { opacity: 0; } 64%, 100% { opacity: 1; } }
    @keyframes tDead { 0%, 38% { opacity: 0; } 40%, 60% { opacity: 1; } 62%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
  </style>
  <defs>
    <path id="tkt" d="M-13-8H13A3 3 0 0 1 16-5V-3A3 3 0 0 0 16 3V5A3 3 0 0 1 13 8H-13A3 3 0 0 1-16 5V3A3 3 0 0 0-16-3V-5A3 3 0 0 1-13-8Z"/>
  </defs>

  <rect width="1200" height="440" rx="22" fill="#0C1728"/>

  <!-- Identity -->
  <g transform="translate(56 64)">
    <rect width="64" height="64" rx="14" fill="#13233A" stroke="#2E4468"/>
    <g stroke="#2DD4BF" stroke-width="3.2" stroke-linecap="round"><line x1="25" y1="24.5" x2="16.5" y2="16"/><line x1="39" y1="24.5" x2="47.5" y2="16"/></g>
    <line x1="32" y1="41" x2="32" y2="45.5" stroke="#6B7F9C" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.01 4.4"/>
    <rect x="8" y="7" width="12" height="12" rx="3" fill="#2DD4BF"/>
    <rect x="44" y="7" width="12" height="12" rx="3" fill="#2DD4BF"/>
    <rect x="27.1" y="47.6" width="9.8" height="9.8" rx="2.6" fill="none" stroke="#6B7F9C" stroke-width="2.2"/>
    <path d="M22 25H42A3 3 0 0 1 45 28V29A3 3 0 0 0 45 35V36A3 3 0 0 1 42 39H22A3 3 0 0 1 19 36V35A3 3 0 0 0 19 29V28A3 3 0 0 1 22 25Z" fill="#F5B544"/>
    <line x1="37" y1="27.6" x2="37" y2="36.6" stroke="#0C1728" stroke-width="1.6" stroke-dasharray="1.6 1.4"/>
  </g>
  <text x="56" y="192" font-size="50" font-weight="750" letter-spacing="-1">FleetPermit</text>
  <text x="56" y="238" font-size="23" font-weight="600">Least privilege for agents,</text>
  <text x="56" y="268" font-size="23" font-weight="600">across every cluster.</text>
  <text class="muted" x="56" y="310" font-size="16">Define who can call which tool, on which</text>
  <text class="muted" x="56" y="332" font-size="16">clusters, and for how long.</text>
  <text class="muted" x="56" y="378" font-size="13.5">Built on Kubernetes, Open Cluster Management, Envoy, SPIFFE and MCP</text>

  <!-- Scene -->
  <g transform="translate(0 0)">
    <!-- wires -->
    <line x1="720" y1="220" x2="940" y2="108" stroke="#2E4468" stroke-width="2.5"/>
    <line x1="720" y1="220" x2="940" y2="220" stroke="#2E4468" stroke-width="2.5"/>
    <line x1="720" y1="220" x2="940" y2="332" stroke="#5B6F8C" stroke-width="2" stroke-dasharray="6 6"/>
    <g class="a allowP">
      <line x1="720" y1="220" x2="940" y2="108" stroke="#2DD4BF" stroke-width="2.5"/>
      <line x1="720" y1="220" x2="940" y2="220" stroke="#2DD4BF" stroke-width="2.5"/>
    </g>
    <g transform="translate(836 280)">
      <circle r="10" fill="#0C1728" stroke="#FF7A7A" stroke-width="2"/>
      <path d="M-4-4L4 4M4-4L-4 4" stroke="#FF7A7A" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- FleetPermit hub node -->
    <rect x="560" y="160" width="160" height="120" rx="16" fill="#13233A" stroke="#2DD4BF" stroke-width="1.8"/>
    <text x="640" y="200" font-size="17" font-weight="700" text-anchor="middle">FleetPermit</text>
    <text class="muted" x="640" y="222" font-size="13" text-anchor="middle">on the OCM hub</text>
    <text class="mono" x="640" y="256" font-size="12.5" text-anchor="middle" fill="#F5B544">restart_workload</text>

    <!-- lease timer -->
    <g transform="translate(640 106)">
      <circle r="26" fill="none" stroke="#2E4468" stroke-width="5"/>
      <circle class="a ring" r="26" fill="none" stroke="#F5B544" stroke-width="5" stroke-linecap="round" stroke-dasharray="163.4" transform="rotate(-90)"/>
      <text class="a tLive mono" y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#F5B544">10m</text>
      <text class="a tDead mono" y="5" font-size="13" font-weight="700" text-anchor="middle" fill="#FF7A7A" opacity="0">0m</text>
    </g>

    <!-- clusters -->
    <g transform="translate(960 68)">
      <rect width="200" height="80" rx="14" fill="#13233A" stroke="#2E4468" stroke-width="1.5"/>
      <text class="mono" x="18" y="32" font-size="16" font-weight="700">cluster-east</text>
      <text class="muted" x="18" y="56" font-size="12.5">env=production</text>
      <g class="a allowP"><rect x="132" y="44" width="56" height="22" rx="11" fill="#0F3B3A"/><text x="160" y="60" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2DD4BF">ALLOW</text></g>
      <g class="a denyP" opacity="0"><rect x="132" y="44" width="56" height="22" rx="11" fill="#4A1D27"/><text x="160" y="60" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FF7A7A">DENY</text></g>
    </g>
    <g transform="translate(960 180)">
      <rect width="200" height="80" rx="14" fill="#13233A" stroke="#2E4468" stroke-width="1.5"/>
      <text class="mono" x="18" y="32" font-size="16" font-weight="700">cluster-west</text>
      <text class="muted" x="18" y="56" font-size="12.5">env=production</text>
      <g class="a allowP"><rect x="132" y="44" width="56" height="22" rx="11" fill="#0F3B3A"/><text x="160" y="60" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2DD4BF">ALLOW</text></g>
      <g class="a denyP" opacity="0"><rect x="132" y="44" width="56" height="22" rx="11" fill="#4A1D27"/><text x="160" y="60" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FF7A7A">DENY</text></g>
    </g>
    <g transform="translate(960 292)">
      <rect width="200" height="80" rx="14" fill="#0F1E33" stroke="#5B6F8C" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text class="mono" x="18" y="32" font-size="16" font-weight="700" fill="#C3CFDF">cluster-edge</text>
      <text class="muted" x="18" y="56" font-size="12.5">env=staging</text>
      <rect x="132" y="44" width="56" height="22" rx="11" fill="#4A1D27"/><text x="160" y="60" font-size="11.5" font-weight="700" text-anchor="middle" fill="#FF7A7A">DENY</text>
    </g>

    <!-- permits -->
    <g transform="translate(932 108)"><g class="a tokE"><use href="#tkt" fill="#F5B544"/><line x1="6" y1="-5.5" x2="6" y2="5.5" stroke="#0C1728" stroke-width="1.6" stroke-dasharray="1.6 1.4"/></g></g>
    <g transform="translate(932 220)"><g class="a tokW"><use href="#tkt" fill="#F5B544"/><line x1="6" y1="-5.5" x2="6" y2="5.5" stroke="#0C1728" stroke-width="1.6" stroke-dasharray="1.6 1.4"/></g></g>

    <!-- captions -->
    <text class="a capA" x="560" y="404" font-size="15"><tspan fill="#2DD4BF" font-weight="700">Granted:</tspan><tspan class="muted"> restart_workload on east and west for 10 minutes</tspan></text>
    <text class="a capB" x="560" y="404" font-size="15" opacity="0"><tspan fill="#FF7A7A" font-weight="700">Expired:</tspan><tspan class="muted"> the gateway denies on its own, even without the hub</tspan></text>
    <text class="a capC" x="560" y="404" font-size="15" opacity="0"><tspan fill="#F5B544" font-weight="700">New lease:</tspan><tspan class="muted"> FleetPermit delivers a fresh permit</tspan></text>
  </g>
</svg>
