<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="life-t life-d">
  <title id="life-t">ToolAccessLease lifecycle</title>
  <desc id="life-d">A new ToolAccessLease is checked against its policy. If the subject, tools or duration violate the policy, it becomes Denied, which is terminal. Otherwise it is Pending until a requested cluster is placed and has room under the upstream rule limit, and it becomes Active once a grant is rendered on at least one selected cluster; the grant is a CEL rule with request.time before the expiry timestamp. At expiresAt the Envoy gateway stops honouring the grant and the lease becomes Expired, which is also terminal, and the controller withdraws the grant. Deleting an Active lease revokes it on every cluster. expiresAt equals creationTimestamp plus duration, is computed once and is never extended.</desc>
  <defs>
    <style>
      svg { fill: #E6EDF6; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .h1 { font-size: 24px; font-weight: 700; }
      .st { font-size: 21px; font-weight: 750; }
      .sm { font-size: 13.5px; fill: #A9B8CD; }
      .xs { font-size: 12.5px; fill: #A9B8CD; }
      .allow { fill: #2DD4BF; }
      .lease { fill: #F5B544; }
      .deny { fill: #FF7A7A; }
      .muted { fill: #C3CFDF; }
      .box { fill: #13233A; stroke-width: 1.8; }
      .wire { fill: none; stroke: #7F93B0; stroke-width: 2; }
    </style>
    <marker id="life-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7F93B0"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="20" fill="#0C1728"/>
  <text class="h1" x="40" y="52">ToolAccessLease lifecycle</text>
  <text class="sm" x="40" y="78">Four phases. Denied and Expired are terminal: to act again, create a new lease.</text>

  <!-- start -->
  <circle cx="54" cy="176" r="8" fill="#7F93B0"/>
  <path class="wire" d="M62 176H96" marker-end="url(#life-a)"/>
  <text class="xs" x="40" y="206">created</text>

  <!-- Pending -->
  <rect class="box" x="100" y="116" width="250" height="120" rx="14" stroke="#7F93B0"/>
  <text class="st muted" x="122" y="150">Pending</text>
  <text class="sm" x="122" y="178">Checked against the policy.</text>
  <text class="sm" x="122" y="197">Waits until a requested</text>
  <text class="sm" x="122" y="216">cluster is placed and has room</text>

  <!-- Pending → Active -->
  <path class="wire" d="M350 176H464" marker-end="url(#life-a)"/>
  <text class="xs" x="407" y="160" text-anchor="middle">grant rendered on</text>
  <text class="xs" x="407" y="198" text-anchor="middle">a selected cluster</text>

  <!-- Active -->
  <rect class="box" x="468" y="100" width="324" height="152" rx="14" stroke="#2DD4BF"/>
  <text class="st allow" x="490" y="134">Active</text>
  <text class="sm" x="490" y="160">Envoy allows the leased tools while</text>
  <text class="xs mono allow" x="490" y="186">request.time &lt;</text>
  <text class="xs mono allow" x="490" y="204">timestamp('2026-09-26T10:15:00Z')</text>
  <text class="xs" x="490" y="234">Ready once every cluster reports the digest</text>

  <!-- Active → Expired -->
  <path class="wire" d="M792 176H906" marker-end="url(#life-a)"/>
  <text class="xs" x="849" y="160" text-anchor="middle">request.time</text>
  <text class="xs" x="849" y="198" text-anchor="middle">reaches expiresAt</text>

  <!-- Expired -->
  <rect class="box" x="910" y="116" width="250" height="120" rx="14" stroke="#F5B544"/>
  <rect x="915" y="121" width="240" height="110" rx="10" fill="none" stroke="#F5B544" stroke-opacity="0.45"/>
  <text class="st lease" x="932" y="150">Expired</text>
  <text class="sm" x="932" y="178">Envoy denies at expiresAt;</text>
  <text class="sm" x="932" y="197">the controller withdraws</text>
  <text class="sm" x="932" y="216">the grant</text>

  <!-- Pending → Denied -->
  <path class="wire" d="M225 236V318" marker-end="url(#life-a)"/>
  <text class="xs" x="238" y="274">WHO, WHAT or</text>
  <text class="xs" x="238" y="292">HOW LONG fails</text>

  <!-- Denied -->
  <rect class="box" x="100" y="322" width="250" height="132" rx="14" stroke="#FF7A7A"/>
  <rect x="105" y="327" width="240" height="122" rx="10" fill="none" stroke="#FF7A7A" stroke-opacity="0.45"/>
  <text class="st deny" x="122" y="356">Denied</text>
  <text class="xs mono" x="122" y="382">SubjectNotAllowed</text>
  <text class="xs mono" x="122" y="400">PermissionNotAllowed</text>
  <text class="xs mono" x="122" y="418">DurationExceedsMaximum</text>
  <text class="xs mono" x="122" y="436">PolicyNotFound</text>

  <!-- Active → deleted -->
  <path class="wire" d="M630 252V318" marker-end="url(#life-a)" stroke-dasharray="6 5"/>
  <rect x="468" y="322" width="324" height="84" rx="14" fill="none" stroke="#7F93B0" stroke-dasharray="6 5" stroke-width="1.6"/>
  <text class="sm" x="490" y="354" fill="#E6EDF6">Lease deleted</text>
  <text class="xs" x="490" y="380">The grant is revoked on every cluster.</text>
  <text class="xs" x="490" y="397">The spec is immutable, so nothing is extended.</text>

  <!-- timeline -->
  <g transform="translate(0 0)">
    <line x1="100" y1="500" x2="1160" y2="500" stroke="#2E4468" stroke-width="2"/>
    <rect x="300" y="494" width="560" height="12" rx="6" fill="#F5B544"/>
    <line x1="860" y1="500" x2="1160" y2="500" stroke="#FF7A7A" stroke-width="3" stroke-dasharray="7 6"/>
    <line x1="300" y1="484" x2="300" y2="516" stroke="#E6EDF6" stroke-width="2"/>
    <line x1="860" y1="484" x2="860" y2="516" stroke="#E6EDF6" stroke-width="2"/>
    <text class="xs mono" x="300" y="476" text-anchor="middle">creationTimestamp 10:05:00Z</text>
    <text class="xs mono" x="860" y="476" text-anchor="middle">expiresAt 10:15:00Z</text>
    <text class="xs lease" x="580" y="530" text-anchor="middle">duration 10m: leased tools ALLOW</text>
    <text class="xs deny" x="1010" y="530" text-anchor="middle">after expiry: DENY</text>
    <text class="xs" x="100" y="530">expiresAt is computed once, never extended</text>
  </g>
</svg>
